name: Build tooling and release assets

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tooling:
    # Only check out the commit already merged into the base repository.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.merge_commit_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    concurrency:
      group: prepare-tooling-${{ matrix.platform }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    # pull_request_target defaults to read-only caching on the default branch.
    cache-mode: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/tooling
        with:
          platform: ${{ matrix.platform }}
          prepare: 'true'

  validate-tag:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          version="^v${number}\.${number}\.${number}(-rc\.${number})?$"
          if [[ ! $GITHUB_REF_NAME =~ $version ]]; then
            echo 'Expected a tag such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi

  build-linux:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/tooling
        id: tooling
        with:
          platform: linux
      - name: Test and build Linux x86-64
        env:
          MAGAZIN_TOOLING_IMAGE: ${{ steps.tooling.outputs.image }}
          NUITKA_CACHE_DIRECTORY: .nuitka-cache
        run: bash build-linux.sh
      - name: Package the executable and record its archive checksum
        working-directory: dist
        run: |
          tar --mode=0755 -czf Magazin-linux-x64.release.tar.gz Magazin-linux-x64.release
          sha256sum Magazin-linux-x64.release.tar.gz > linux.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: magazin-linux-x64
          path: |
            dist/Magazin-linux-x64.release.tar.gz
            dist/linux.sha256
          if-no-files-found: error
          compression-level: 0

  build-windows:
    needs: validate-tag
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/tooling
        id: tooling
        with:
          platform: windows
      - name: Test and build Windows x64 in Docker
        shell: powershell
        env:
          TOOLING_IMAGE: ${{ steps.tooling.outputs.image }}
        run: .\build-windows.ps1 -Isolation process -ToolingImage $env:TOOLING_IMAGE -CacheDirectory .nuitka-cache
      - name: Record the Windows executable checksum
        shell: pwsh
        working-directory: dist
        run: |
          $hash = (Get-FileHash -LiteralPath 'Magazin.release.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD.Path 'windows.sha256'), "$hash  Magazin.release.exe`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: magazin-windows-x64
          path: |
            dist/Magazin.release.exe
            dist/windows.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: magazin-linux-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: magazin-windows-x64
          path: release
      - name: Verify the downloaded release assets
        working-directory: release
        run: |
          test -s Magazin.release.exe
          test -s Magazin-linux-x64.release.tar.gz
          test -s windows.sha256
          test -s linux.sha256
          cat windows.sha256 linux.sha256 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attach assets to the published release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            Magazin.release.exe Magazin-linux-x64.release.tar.gz SHA256SUMS
